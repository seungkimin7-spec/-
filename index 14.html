// Detect medicine rows from recognized text rather than assuming page coordinates.
function medicineCandidates(text){
 const lines=String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 const headers=/약품명|의약품명|처방약품|약\s*품\s*명|약제명/;
 const reject=/성명|주소|전화|주민등록|병원|약국|환자번호|주의사항|용법|처방일|생년월일|진료과|의사명|보험|환자명|접수번호|수납/;
 const med=/가상\s*약품|테스트정|시험약|\b(?:[A-Z]\d{2,4})\b|(?:정|캡슐|시럽|주사|mg|㎎|밀리그램|ml|정제)/i;
 const heading=lines.findIndex(s=>headers.test(s));
 const section=heading>=0?lines.slice(heading+1,heading+24):lines;
 return [...new Set(section.filter(s=>s.length>=3&&s.length<=90&&!reject.test(s)&&med.test(s)))].slice(0,16);
}
function ocrSectionScore(text){
 const lines=String(text||'').split(/\r?\n/);
 return medicineCandidates(text).length*10+lines.filter(x=>/약품명|의약품명|처방약품|약제명/.test(x)).length*4;
}

function binaryCanvas(source){const c=document.createElement('canvas');c.width=source.width;c.height=source.height;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(source,0,0);const image=ctx.getImageData(0,0,c.width,c.height),d=image.data;let sum=0;for(let i=0;i<d.length;i+=4)sum+=d[i];const mean=sum/(d.length/4);for(let i=0;i<d.length;i+=4){const v=d[i]<Math.max(80,Math.min(210,mean*.87))?0:255;d[i]=d[i+1]=d[i+2]=v}ctx.putImageData(image,0,0);return c}

  else body=q.options.map(([v,t])=>`<button type="button" class="opt${cur===v?' on':''}" data-v="${v}">${safe(t)}</button>`).join('');
  body+=`<button type="button" class="opt unk${cur==='unknown'?' on':''}" data-v="unknown">❓ 잘 모르겠어요</button>`;
  $('screen').innerHTML=`<p class="muted">질문 ${state.qi+1} / ${qs.length}</p><h1 id="qtitle">${safe(q.label)}</h1><div class="meter" aria-hidden="true"><span style="width:${Math.round((state.qi+1)/qs.length*100)}%"></span></div><button type="button" class="secondary full" id="qspeak">🔊 질문 읽어주기</button><div id="opts">${body}</div><p class="hint">모르는 항목은 '잘 모르겠어요'를 누르세요. 그 경우 '추가 확인 필요'로 표시합니다.</p><div class="actions"><button type="button" class="secondary" id="qprev">← 이전 질문</button></div>`+nav();
  const go=v=>{state.answers[q.id]=v;if(state.qi+1>=visibleQs().length){pruneAnswers();setStep(3)}else{state.qi++;survey();window.scrollTo(0,0);$('qtitle').focus&&$('qtitle').setAttribute('tabindex','-1')}};
  $('qspeak').onclick=()=>speak(q.label+' '+(q.options?q.options.map(o=>o[1]).join(', ')+', 잘 모르겠어요':''));
  $('qprev').onclick=()=>{if(state.qi>0){state.qi--;survey();window.scrollTo(0,0)}else setStep(1)};
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>go(b.dataset.v));
  if($('ansOk'))$('ansOk').onclick=()=>{if(q.type==='number'){const v=$('ansNum').value,n=Number(v);if(v===''||!Number.isInteger(n)||n<0||n>120){alert('만 나이를 0~120 사이 숫자로 입력해 주세요. 모르면 아래 \'잘 모르겠어요\'를 누르세요.');return}go(String(n))}else{const v=$('ansSel').value;if(!v){alert('지역을 선택해 주세요. 모르면 아래 \'잘 모르겠어요\'를 누르세요.');return}go(v)}};
}
const LV={possible:'주요 조건 충족 가능',check:'추가 확인 필요',unlikely:'조건 불일치'};
const MARK={yes:'✔',unknown:'?',no:'✘'};
function evalScheme(s){const rs=s.rules.map(r=>({t:r.t,st:r.f(state.answers)}));const no=rs.some(r=>r.st==='no'),unk=rs.some(r=>r.st==='unknown');return {s,rs,level:no?'unlikely':unk?'check':'possible'}}
function summaryHTML(){const a=state.answers,L={national:'건강보험',medical:'의료급여',basic:'기초생활수급',near:'차상위',low:'소득 낮은 편',other:'일반/기타',severe:'중증질환',chronic:'만성질환',high:'부담 큼',normal:'부담 적음',yes:'필요',no:'불필요',alone:'혼자 거주',family:'가족과 거주'};const v=k=>a[k]===undefined?'-':a[k]==='unknown'?'잘 모르겠어요':k==='age'?a[k]+'세':(L[a[k]]||a[k]);return `만 나이: ${safe(v('age'))} · 지역: ${safe(v('region'))}<br>보험: ${safe(v('insurance'))} · 경제상황: ${safe(a.insurance==='medical'?'의료급여 수급':v('income'))}<br>질환: ${safe(v('condition'))} · 의료비: ${safe(v('expense'))}<br>돌봄 필요: ${safe(v('care'))} · 거주: ${safe(v('living'))}<br>처방약: ${safe((state.fields.meds||'미입력').split('\n').filter(Boolean).slice(0,3).join(', ')||'미입력')}`}
function results(){
  if(state.detail){detail(state.detail);return}
  pruneAnswers();const order={possible:0,check:1,unlikely:2};const list=schemes.map(evalScheme).sort((a,b)=>order[a.level]-order[b.level]);state.list=list;
  const groups=['possible','check','unlikely'].map(l=>{const g=list.filter(x=>x.level===l);return g.length?`<h2 class="grp">${LV[l]} (${g.length})</h2>`+g.map(x=>`<article class="card lv-${l}"><div class="badge">${LV[l]}</div><h2>${safe(x.s.name)}</h2><p>${safe(x.s.desc)}</p><ul class="reasons">${x.rs.map(r=>`<li><b class="m-${r.st}">${MARK[r.st]}</b> ${safe(r.t)}</li>`).join('')}</ul><p class="muted"><strong>담당:</strong> ${safe(x.s.agency)}</p><div class="actions"><button type="button" class="outline" data-d="${x.s.id}">자세히 보기</button><a class="btn outline" target="_blank" rel="noopener noreferrer" href="${x.s.url}">공식 사이트 ↗</a></div></article>`).join(''):''}).join('');
  $('screen').innerHTML=`<h1>④ 의료복지 추천 결과</h1><div class="note"><strong>이 결과는 수급 자격 판정이 아닙니다.</strong> 입력하신 답으로 살펴볼 만한 제도를 정리한 참고 자료입니다. 최종 자격은 해당 기관에서 확인해 주세요.</div><div class="panel"><strong>입력 정보 요약</strong><p>${summaryHTML()}</p><p class="muted">✔ 일치 · ? 확인 필요 · ✘ 불일치</p></div>${groups}<div class="note">상담 전화: 보건복지상담센터 ☎129, 국민건강보험공단 ☎1577-1000, 국민연금공단 ☎1355</div><button class="secondary full" id="speak">🔊 결과 읽어주기</button><button class="secondary full" id="stopSpeak">음성 중지</button><button class="secondary full" id="edit">설문 다시 수정하기</button><button class="outline full" id="print">결과 인쇄 또는 PDF 저장</button><button class="secondary full" id="export">결과를 텍스트로 저장</button><div class="panel"><strong>🔒 개인정보 안내</strong><p>처방전 사진과 입력한 내용은 이 화면(기기 메모리)에만 있고, 이 앱은 브라우저 저장소에 저장하지 않습니다. 새로고침하거나 아래 버튼을 누르면 사라집니다. 서버 인식을 선택하고 동의한 경우에만 사진이 전송됩니다.</p><button class="full danger" id="wipe">🗑 내 정보 모두 지우고 처음으로</button></div>`+nav();
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{state.detail=b.dataset.d;results();window.scrollTo(0,0)});
  $('speak').onclick=()=>speak('의료복지 추천 결과입니다. 자격을 확정하는 결과가 아닙니다. '+list.map(x=>x.s.name+', '+LV[x.level]).join('. '));
  $('stopSpeak').onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel()};
  $('edit').onclick=()=>{state.qi=0;setStep(2)};
  $('print').onclick=()=>window.print();
  $('wipe').onclick=()=>{if(confirm('입력한 사진, 약품명, 설문 답변을 모두 지웁니다. 계속할까요?')){reset();alert('모두 지웠습니다.')}};
  $('export').onclick=()=>{const txt=['의료복지 나침반 결과 (자격 판정이 아닌 참고 자료)','작성일: '+new Date().toLocaleDateString('ko-KR'),'',...list.map(x=>`[${LV[x.level]}] ${x.s.name}\n  담당: ${x.s.agency} / ${x.s.tel}\n  확인할 것: ${x.s.confirm.join('; ')}\n  공식 사이트: ${x.s.url}`),'','제도의 최신 조건은 반드시 공식 기관에서 확인하세요.'].join('\n');const u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='medicompass_results.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
}
function detail(id){
  const x=evalScheme(schemes.find(s=>s.id===id)),s=x.s;
  $('screen').innerHTML=`<button type="button" class="secondary" id="dback">← 결과 목록으로</button><div class="badge" style="margin-top:16px">${LV[x.level]}</div><h1>${safe(s.name)}</h1><p>${safe(s.desc)}</p><div class="panel"><strong>내 답변과 비교</strong><ul class="reasons">${x.rs.map(r=>`<li><b class="m-${r.st}">${MARK[r.st]}</b> ${safe(r.t)}</li>`).join('')}</ul></div><div class="panel"><strong>꼭 확인할 것</strong><ul>${s.confirm.map(c=>`<li>${safe(c)}</li>`).join('')}</ul></div><div class="panel"><strong>신청·문의</strong><p>${safe(s.apply)}</p><p>${safe(s.tel)}</p></div><div class="note">${s.verified?'✔ '+safe(s.verifiedNote)+' (확인일 '+VERIFIED_ON+')':'이 앱은 이 제도의 세부 자격 기준을 공식 자료로 확인하지 못했습니다. 위 내용은 제도의 일반적 취지이며, 정확한 조건은 반드시 공식 기관에서 확인하세요.'}</div><a class="btn full" target="_blank" rel="noopener noreferrer" href="${s.url}">공식 사이트 열기 ↗</a><button type="button" class="secondary full" id="dspeak">🔊 읽어주기</button>`;
  $('dback').onclick=()=>{state.detail=null;results();window.scrollTo(0,0)};
  $('dspeak').onclick=()=>speak(s.name+'. '+s.desc+' 꼭 확인할 것. '+s.confirm.join('. ')+'. '+s.apply);
}
$('fontBtn').onclick=()=>{state.large=!state.large;document.body.classList.toggle('large',state.large);$('fontBtn').textContent=state.large?'가 기본 글씨':'가 글씨 크게'};render();
</script></body></html>
